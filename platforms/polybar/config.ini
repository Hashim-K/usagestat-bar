[module/usagestat]
type = custom/script
exec = usagestat-bar polybar --watch
tail = true
interval = 1
format = <label>
label = %output%
click-left = usagestat-bar toggle
click-right = usagestat-bar preferences
click-middle = usagestat-bar refresh
scroll-up = usagestat-bar scroll-previous
scroll-down = usagestat-bar scroll-next
