; Add the installed logo font to your [bar/...] font list, for example:
; font-1 = UsageStat Provider Icons:pixelsize=20;3
; Keep your normal text font as font-0. Polybar selects the logo font for its
; private-use glyphs; no fixed font index or Nerd Font is required.
[module/usagestat]
type = custom/script
exec = usagestat-bar polybar --watch
tail = true
interval = 1
format = <label>
label = %output%
click-left = usagestat-bar toggle
click-right = usagestat-bar preferences
click-middle = usagestat-bar refresh
scroll-up = usagestat-bar scroll-previous
scroll-down = usagestat-bar scroll-next
